name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install --no-deps .
      - name: Formatting and static sanity
        run: |
          python scripts/quality.py
          python -m compileall -q src tests scripts
      - name: Full unit integration concurrency and adversarial suite
        env:
          PYTHONHASHSEED: random
        run: PYTHONPATH=src:. python -m unittest discover -s tests -v
      - name: Evidence manifest integrity
        run: python scripts/verify_manifest.py
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build real image
        run: docker build -t chronosqueue:ci .
      - name: Boot Compose deployment
        run: docker compose up -d --build
      - name: Wait for readiness
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          docker compose logs
          exit 1
      - name: Real submit claim complete smoke
        run: python scripts/container_smoke.py
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Shutdown
        if: always()
        run: docker compose down -v
