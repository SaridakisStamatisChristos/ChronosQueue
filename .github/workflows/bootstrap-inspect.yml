name: Bootstrap inspection

on:
  push:
    branches: [r7-zero-to-hero]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect chunked bootstrap payload
        shell: python
        run: |
          import base64
          import hashlib
          import json
          import pathlib
          import zlib

          parts = sorted(pathlib.Path('.bootstrap').glob('part-*'))
          if not parts:
              raise SystemExit('no bootstrap parts found')
          encoded = b''.join(p.read_bytes().strip() for p in parts)
          compressed = base64.b64decode(encoded, validate=True)
          dec = zlib.decompressobj(16 + zlib.MAX_WBITS)
          payload = dec.decompress(compressed)
          pathlib.Path('bootstrap.partial').write_bytes(payload)

          report = {
              'parts': [p.name for p in parts],
              'encoded_bytes': len(encoded),
              'compressed_bytes': len(compressed),
              'decompressed_bytes': len(payload),
              'gzip_eof': dec.eof,
              'compressed_sha256': hashlib.sha256(compressed).hexdigest(),
              'decompressed_sha256': hashlib.sha256(payload).hexdigest(),
              'prefix_hex': payload[:64].hex(),
              'tar_entries': [],
              'tar_truncated': False,
          }

          offset = 0
          while offset + 512 <= len(payload):
              header = payload[offset:offset + 512]
              if header == b'\0' * 512:
                  break
              name = header[:100].split(b'\0', 1)[0].decode('utf-8', 'replace')
              prefix = header[345:500].split(b'\0', 1)[0].decode('utf-8', 'replace')
              if prefix:
                  name = prefix + '/' + name
              raw_size = header[124:136].split(b'\0', 1)[0].strip() or b'0'
              try:
                  size = int(raw_size, 8)
              except ValueError:
                  report['tar_truncated'] = True
                  break
              typeflag = header[156:157].decode('ascii', 'replace') or '0'
              report['tar_entries'].append({'path': name, 'size': size, 'type': typeflag})
              next_offset = offset + 512 + ((size + 511) // 512) * 512
              if next_offset > len(payload):
                  report['tar_truncated'] = True
                  break
              offset = next_offset

          pathlib.Path('bootstrap-inspection.json').write_text(
              json.dumps(report, indent=2, sort_keys=True), encoding='utf-8'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-inspection
          path: |
            bootstrap-inspection.json
            bootstrap.partial
          retention-days: 1
