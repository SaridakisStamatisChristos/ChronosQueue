name: R7 Bootstrap

on:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and expand R7 package
        shell: bash
        run: |
          set -euo pipefail
          echo "23367d9e938ca6b2dc484f56eaec5a0f322e645ef30cefac237dc06fc5cf585b  .bootstrap/package.tar.gz" | sha256sum -c -
          tar -xzf .bootstrap/package.tar.gz
          rm -rf .bootstrap .github/workflows/bootstrap.yml
          python scripts/generate_manifest.py
          python scripts/quality.py
          PYTHONPATH=src:. python -m unittest discover -s tests -v
          python scripts/verify_manifest.py
      - name: Commit synthesized repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: synthesize ChronosQueue with UCS-Pro R7"
          git push origin HEAD:${GITHUB_REF_NAME}
