name: r7-bootstrap
on:
  push:
    branches: [r7-zero-to-hero]
permissions:
  contents: write
jobs:
  reconstruct-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact tested tree
        run: |
          cat .bootstrap/part-* | base64 -d > /tmp/chronosqueue-r7.tar.gz
          echo "ea60d7f4063ee4b69ec4cb4c25a33a816c57a95548ff02f2ec062d6e4a67e28f  /tmp/chronosqueue-r7.tar.gz" | sha256sum -c -
          tar -xzf /tmp/chronosqueue-r7.tar.gz -C .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source, tests, contracts and evidence
        run: |
          PYTHONPATH=src python -m compileall -q src tests scripts
          PYTHONPATH=src python scripts/check_format.py
          PYTHONPATH=src python scripts/static_check.py
          PYTHONPATH=src python -W error::ResourceWarning -m unittest discover -s tests -v
          PYTHONPATH=src python scripts/check_repo.py
          PYTHONPATH=src python scripts/verify_manifest.py
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build production image
        run: docker build -t chronosqueue:r7 .
      - name: Boot production Compose deployment
        run: docker compose up -d --build
      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/ready; then exit 0; fi
            sleep 1
          done
          docker compose logs
          exit 1
      - name: Real container submit claim complete smoke
        run: |
          J=$(curl -fsS -X POST http://127.0.0.1:8080/v1/jobs -H 'content-type: application/json' -d '{"queue":"bootstrap-ci","payload":{"x":1}}' | python -c 'import sys,json; print(json.load(sys.stdin)["job"]["id"])')
          C=$(curl -fsS -X POST http://127.0.0.1:8080/v1/worker/claim -H 'content-type: application/json' -d '{"worker_id":"bootstrap-worker","queues":["bootstrap-ci"],"lease_ms":30000}')
          T=$(printf '%s' "$C" | python -c 'import sys,json; print(json.load(sys.stdin)["lease_token"])')
          curl -fsS -X POST http://127.0.0.1:8080/v1/worker/bootstrap-worker/complete -H 'content-type: application/json' -d "{\"job_id\":\"$J\",\"lease_token\":\"$T\",\"result\":{\"ok\":true}}"
          curl -fsS http://127.0.0.1:8080/v1/jobs/$J | python -c 'import sys,json; assert json.load(sys.stdin)["state"]=="succeeded"'
      - if: always()
        name: Tear down container
        run: docker compose down -v || true
      - name: Commit verified product files without workflow mutation
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: build ChronosQueue R7'
          git push origin HEAD:r7-zero-to-hero
