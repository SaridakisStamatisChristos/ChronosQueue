[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronosqueue"
version = "0.1.0"
description = "Local-first durable job queue and task scheduler"
requires-python = ">=3.11"
authors = [{name = "ChronosQueue contributors"}]
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
chronosqueue = "chronosqueue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chronosqueue = ["migrations/*.sql", "openapi.yaml"]
