[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronosqueue"
version = "0.1.0"
description = "Local-first durable job queue and task scheduler"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Stamatis-Christos Saridakis"}]
dependencies = []

[project.scripts]
chronosqueue = "chronosqueue.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
